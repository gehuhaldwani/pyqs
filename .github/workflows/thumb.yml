name: Generate Thumbnails

# Keeps the thumbnails branch in sync with the PDFs on main: one 512px WebP of each PDF's first page.
# The sync compares state, so any run fixes thumbnails that earlier failed or cancelled runs missed.

on:
  push:
    branches:
      - main
    paths:
      - "**.pdf"
      - "**.PDF"
      - ".github/workflows/thumb.yml"
      - ".github/scripts/sync-thumbnails.sh"

  workflow_dispatch:
    inputs:
      rebuild:
        description: Render every thumbnail again
        type: boolean
        default: false

# Cancelling an older run is safe, because the newer run picks up everything it missed.
concurrency:
  group: thumbnails
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04

    env:
      REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git

    steps:
      # Without file contents, and with only .github in the working tree. The script adds the PDFs it renders.
      - name: Check out main
        uses: actions/checkout@v6
        with:
          filter: blob:none
          sparse-checkout: /.github/
          sparse-checkout-cone-mode: false

      - name: Install poppler and webp
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends poppler-utils webp

      - name: Check out the thumbnails branch
        run: |
          if git ls-remote --exit-code --heads "$REMOTE" thumbnails > /dev/null; then
            git clone --quiet --depth 1 --branch thumbnails --single-branch "$REMOTE" "$RUNNER_TEMP/thumbnails"
          else
            git init --quiet "$RUNNER_TEMP/thumbnails"
          fi

      - name: Sync thumbnails
        id: sync
        env:
          OUT: ${{ runner.temp }}/thumbnails
          REBUILD: ${{ inputs.rebuild == true }}
        run: bash .github/scripts/sync-thumbnails.sh

      # The branch keeps a single commit, so old thumbnails don't pile up in its history.
      - name: Push the thumbnails branch
        working-directory: ${{ runner.temp }}/thumbnails
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "Thumbnails are already up to date."
            exit 0
          fi
          commit=$(git commit-tree "$(git write-tree)" -m "Thumbnails for ${GITHUB_SHA::7}")
          git push --force --quiet "$REMOTE" "$commit:refs/heads/thumbnails"

      - name: Fail if some PDFs could not be rendered
        if: steps.sync.outputs.failed != '0'
        run: |
          echo "::error::${{ steps.sync.outputs.failed }} PDFs could not be rendered. See the warnings in the Sync thumbnails step."
          exit 1
